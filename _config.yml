# Site identity. If you fork this, the first few values are the ones you care about.
title: PaperMC-Plugin-Collection
tagline: "Collection of Minecraft plugins for PaperMC"
description: "A collection of Minecraft plugins for PaperMC and compatible servers."

# GitHub Pages URL setup.
url: "https://chalwk.github.io"
baseurl: "/PaperMC-Plugin-Collection"

# Used in the footer and SEO tags.
author:
  name: Jericho Crosby
  handle: Chalwk
  email: chalwk.dev@gmail.com

# Handy links reused in templates.
repository: "Chalwk/PaperMC-Plugin-Collection"
github_username: Chalwk
discord_invite: "https://discord.gg/g6ENWebHsE"

# Markdown and syntax highlighting.
markdown: kramdown
highlighter: rouge
permalink: pretty

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Jekyll plugins. seo-tag feeds the head include, sitemap writes sitemap.xml.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Plugin pages live in `_mcplugins` and get /plugins/<name>/ URLs.
collections:
  mcplugins:
    output: true
    permalink: /plugins/:name/

# Keep build tooling and local server files out of the generated site.
exclude:
  - .github
  - .gitignore
  - .gitattributes
  - .gradle
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - SECURITY.md
  - vendor
  - node_modules
  - papermc_plugins
  - "*.iml"
  - build
  - .idea
  - .vscode
  - build.gradle
  - settings.gradle
  - gradle.properties
  - gradlew
  - gradlew.bat
  - gradle
  - run.bat

# Defaults for front matter.
# The social image is a fallback for pages that do not set one.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/social-preview.png
        alt: "PaperMC Plugin Collection"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "mcplugins"
    values:
      layout: "plugin"
  - scope:
      path: "tools"
    values:
      layout: "page"