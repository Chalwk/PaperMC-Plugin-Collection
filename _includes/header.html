<header class="site-header">
  <div class="container header-inner">

    <!-- Brand links home. -->
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">⛏</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>

    <!-- Primary nav. The Tools menu uses details so it opens without JS. Hell yeah!-->
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/contributing/' | relative_url }}">Contributing</a>

      <details class="nav-dropdown">
        <summary class="nav-dropdown-toggle">
          Tools
          <span class="nav-dropdown-caret" aria-hidden="true"></span>
        </summary>
        <div class="nav-dropdown-menu" role="menu">
          <a role="menuitem" href="{{ '/tools/nexus-editor/' | relative_url }}">
            Nexus YAML Editor
          </a>
        </div>
      </details>

      <a class="nav-external"
         href="https://github.com/{{ site.repository }}"
         target="_blank" rel="noopener">GitHub ↗</a>
    </nav>
  </div>
</header>
