<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e14">

  <!-- SEO tag fills in title, description, canonical, and social cards. -->
  {% seo %}

  <!-- Fonts are loaded from Mr. Google. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="{{ '/assets/css/core.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">

  <!-- Page specific CSS can be added from front matter just FYI. -->
  {% for css in page.extra_css %}
    <link rel="stylesheet" href="{{ css | relative_url }}">
  {% endfor %}

  <!-- Optional inline CSS for one off pages if need be. -->
  {% if page.inline_css %}
    <style>{{ page.inline_css }}</style>
  {% endif %}

  <!-- Favicon is an emoji so there is no extra asset to manage! -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
</head>
