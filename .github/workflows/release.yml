name: Release

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse and validate tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not in the form <plugin>-v<semver> (e.g. adminchat-v1.0.0)"
            exit 1
          fi
          PLUGIN="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          if [ ! -d "papermc_plugins/$PLUGIN" ]; then
            echo "::error::No plugin directory found at papermc_plugins/$PLUGIN"
            exit 1
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "plugin=$PLUGIN"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ steps.parse.outputs.plugin }}
        run: ./gradlew :${{ steps.parse.outputs.plugin }}:build -Pversion=${{ steps.parse.outputs.version }} --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse.outputs.tag }}
          name: ${{ steps.parse.outputs.plugin }} ${{ steps.parse.outputs.version }}
          generate_release_notes: true
          files: papermc_plugins/${{ steps.parse.outputs.plugin }}/build/libs/*.jar
          fail_on_unmatched_files: true