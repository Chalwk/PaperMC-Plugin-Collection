name: Plugin Request
description: Suggest a new plugin, or a feature for an existing one.
title: "[REQUEST] <title>"
labels: [ "enhancement", "needs triage" ]
assignees: Chalwk
body:
  - type: markdown
    attributes:
      value: |
        **Describe the request**
        > Provide a clear and concise description in the following sections.
        > Use headers (`#`) or lists (`-`) to organize your thoughts.
        > Describe the problem you are trying to solve, not just the solution you have in mind.
  - type: dropdown
    id: request-type
    attributes:
      label: Request Type
      description: Is this for a brand new plugin, or an improvement to one that already exists?
      options:
        - New plugin
        - Feature for an existing plugin
        - Other
    validations:
      required: true
  - type: dropdown
    id: existing-plugin
    attributes:
      label: Existing Plugin (if applicable)
      description: If this is a feature request, select the plugin. Otherwise, pick "N/A".
      options:
        - N/A (new plugin)
        - VacuLoot
        - GameModeManager
        - PerkMenu
        - BigBrother
        - AutoMessages
        - AdminChat
        - NoctiView
        - Other (specify below)
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Suggested Category
      description: Which category would this best fit into? Pick the closest match, or suggest a new one.
      placeholder: "e.g., Gameplay, Administration, Cosmetics, Economy, World, Misc"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the task, not the solution. "I need to do X" beats "add a command /foo".
      placeholder: "Describe the problem here"
    validations:
      required: true
  - type: textarea
    id: ideal-output
    attributes:
      label: What would the ideal command and output look like?
      description: Paste a mock-up of the command line and/or the expected in-game output.
      placeholder: |
        Command:
        /example arg1 arg2

        Output:
        [expected output here]
      render: shell
    validations:
      required: false
  - type: textarea
    id: existing-tools
    attributes:
      label: Have you found anything that already does this?
      description: Links to other plugins, SpigotMC resources, or GitHub projects. Optional but helpful.
      placeholder: "Links or references here"
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Write any other context, constraints, or edge cases here. Server version, other plugins, etc.
      placeholder: "Further context or information here"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        **Thank you**
        > **I appreciate your contribution to making this collection of plugins more useful. Your ideas help shape what gets built next!**