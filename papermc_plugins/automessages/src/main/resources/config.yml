# AutoMessages Configuration
config-version: 1

# Time in seconds between each broadcast.
# The scheduler ticks every `interval * 20` ticks, with a minimum of 1 second.
interval: 600

# Periodic broadcasts - one entry per message, keyed by broadcast order.
# Keys are sorted numerically, so gaps in the sequence (e.g. 1, 2, 4, 5) are fine.
#
# Each line is either:
#   1. A plain string  - parsed with legacy '&' color codes.
#   2. A JSON string   - parsed as a Minecraft text component when the
#                        trimmed line starts with '{' and ends with '}'.
#
# See the examples below for both forms, including click and hover events.
broadcasts:

  # Plain legacy-formatted message with no interactivity.
  1:
    - '&e&lNotice'
    - ''
    - '&7Welcome to the server!'
    - '&7Type &b/help&7 to get started.'

  # Multi-line message with a click-to-open-URL line.
  # The click line is JSON; the rest is legacy.
  2:
    - '&e&lNotice'
    - ''
    - '&7Need a hand? Check out our guide.'
    - ' '
    - '{"text":"• Click to open the guide","bold":true,"color":"dark_green","clickEvent":{"action":"open_url","value":"https://example.com/guide/"},"hoverEvent":{"action":"show_text","value":"Opens the guide in your browser"}}'

  # Click-to-run-command. The command runs as the player who clicks.
  3:
    - '&e&lNotice'
    - ''
    - '&7Want to hang out with us?'
    - ' '
    - '{"text":"• Click to join our Discord","bold":true,"color":"dark_green","clickEvent":{"action":"run_command","value":"/discord"},"hoverEvent":{"action":"show_text","value":"Join our Discord server"}}'

  # Click-to-suggest-command. Fills the chat bar but does not send it.
  4:
    - '&e&lNotice'
    - ''
    - '&7Looking for commands?'
    - ' '
    - '{"text":"• Click to suggest /help","color":"yellow","clickEvent":{"action":"suggest_command","value":"/help"},"hoverEvent":{"action":"show_text","value":"Fills your chat bar with /help"}}'

  # Nested text component using `extra`. Useful when you want a legacy-looking
  # prefix and a clickable suffix on the SAME visual line. Note that '&' codes
  # are NOT translated inside JSON, so styling must use JSON fields.
  5:
    - '&e&lNotice'
    - ''
    - '{"text":"","extra":[{"text":"Info: ","color":"yellow","bold":true},{"text":"Click to open the rules","color":"aqua","bold":true,"clickEvent":{"action":"open_url","value":"https://example.com/rules"},"hoverEvent":{"action":"show_text","value":"Opens the rules page"}}]}'

# Messages used by the plugin's own commands. These support '&' color codes.
messages:
  no_permission: "&cYou don't have permission to use this feature!"
  reloaded: "&aConfiguration reloaded and scheduler restarted!"
  unknown_command: "&cUnknown command. Use /automessages help."
  status_header: "&eAutoMessages Status:"
  status_interval: "&7- Interval: &f{interval}s"
  status_total: "&7- Total messages: &f{total}"
  status_next: "&7- Next message index: &f{next}/{total}"
  help:
    - "&6&lAutoMessages Help"
    - "&e/automessages status &7- Show current status"
    - "&e/automessages reload &7- Reload configuration and restart scheduler"
    - "&e/automessages help &7- Show this help"